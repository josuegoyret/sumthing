services:
  api:
    build: ./api
    ports:
      - "8080:8080"
    environment:
      ALLOWED_ORIGIN: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api
